name: CD — AutoProcure

on:
  workflow_run:
    workflows: ["CI — AutoProcure"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  # ─── Job 1 : construire et publier les images ────────────────
  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Préparer les tags
        id: meta
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo=$REPO" >> $GITHUB_OUTPUT
          echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=http://${{ secrets.SERVER_HOST }}:8000/api
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}-frontend:latest
            ghcr.io/${{ steps.meta.outputs.repo }}-frontend:${{ steps.meta.outputs.sha }}

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.API_URL }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}-backend:latest
            ghcr.io/${{ steps.meta.outputs.repo }}-backend:${{ steps.meta.outputs.sha }}

  # ─── Job 2 : scanner les images ──────────────────────────────
  trivy-scan:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Préparer le nom du repo
        id: meta
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo=$REPO" >> $GITHUB_OUTPUT
      - name: Trivy scan — backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "ghcr.io/${{ steps.meta.outputs.repo }}-backend:latest"
          format: "table"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
      - name: Trivy scan — frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "ghcr.io/${{ steps.meta.outputs.repo }}-frontend:latest"
          format: "table"
          severity: "HIGH,CRITICAL"
          exit-code: "1"

  # ─── Job 3 : déployer sur le VPS ─────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: trivy-scan
    steps:
      - uses: actions/checkout@v4

      - name: Copier docker-compose.prod.yml sur le VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml"
          target: "/home/deploy/autoprocure/"

      - name: Déployer via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/deploy/autoprocure
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.prod.yml ps
