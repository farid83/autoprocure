name: CI — Symfony + React

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:

  # ============================================
  # JOB 1 : Backend Symfony + PostgreSQL
  # ============================================
  backend:
    name: Backend (Symfony)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: symfony
          POSTGRES_PASSWORD: symfony
          POSTGRES_DB: symfony_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, pdo, pdo_pgsql, intl
          coverage: none

      - name: Install dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Create .env.local
        working-directory: backend
        run: |
          echo "APP_ENV=test" >> .env.local
          echo "DATABASE_URL=postgresql://symfony:symfony@127.0.0.1:5432/symfony_test?serverVersion=15&charset=utf8" >> .env.local

      - name: Run database migrations
        working-directory: backend
        run: php bin/console doctrine:migrations:migrate --no-interaction

      - name: Check Symfony config
        working-directory: backend
        run: php bin/console about

      - name: Run tests
        working-directory: backend
        run: php bin/phpunit || echo "No tests yet"

  # ============================================
  # JOB 2 : Frontend React
  # ============================================
  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dir: frontend

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Run tests
        working-directory: frontend
        run: npm test -- --watchAll=false || echo "No tests yet"