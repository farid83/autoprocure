# --- Nom du workflow (visible dans l'interface Github Actions)
name: CI — AutoProcure

# --- Evenements qui déclenchent ce workflow
on:
  push:
    branches: [main, develop]           # Déclenche chaque push sur ces branches
  pull_request:
    branches: [main, develop]           # Déclenche chaque pull request vers ces branches

jobs: 
  ci:
    name: ci (frontend)
    runs-on: ubuntu-latest # Machine virtuelle Github (Ubuntu 24.04)

    steps:
      # ETAPE 1 : Récupérer le code source
      - name: Checkout du code
        uses: actions/checkout@v4
        # Action officielle Github qui con votre dépôt sur le runner

      # ETAPE 2 : Installer Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'      # Cache npm pour acélérer les runs suivants
          cache-dependency-path: 'frontend/package-lock.json'

      # ETAPE 3 : Installer les dépendances Javascript  
      - name: Installation dépendances frontend
        run: npm ci         # 'ci'= install propre depuis package-lock.json
        working-directory: frontend

      # ETAPE 4 : Vérifier compilation React
      - name: Build React
        run: npm run build
        working-directory: frontend

      # ETAPE 5 : Vérifier la qualité du code
      - name: Lint ESLint
        run: npm run lint
        working-directory: frontend 
        # Si une règle ESLint est violée, le pipeline s'arrête ici en rouge

      # ETAPE 6 : Exécuter les tests Vitest
      - name: Tests unitaires frontend
        run: npm run test -- --reporter=verbose
        working-directory: frontend

        # '--watchAll=false' : pas de mode interactif (nécessaire en CI)
        # '--ci': le test échoue si un snapshot est obsolète
        # 'npm test' : lance les tests définis dans package.json

  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest # Machine virtuelle Github (Ubuntu 24.04)

    # --- Conteneur de service PostgreSQL pour les tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: inventory_api_db_test
          POSTGRES_USER: anjtech
          POSTGRES_PASSWORD: pass_test
        ports:
          - 5432:5432
        # Vérification que PostgreSQL est prêt avant de continuer
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # ETAPE 1 : Récupérer le code source
      - name: Checkout du code
        uses: actions/checkout@v4

      # ETAPE 2 : Installer PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql
          coverage: none
          # On installe pdo_pgsql pour le support PostgreSQL

      # ETAPE 3 : Installer les dépendances PHP (Composer)
      - name: Installation dépendances backend
        run: composer install --no-progress --no-suggest --prefer-dist
        working-directory: backend

      # ETAPE 4 : Préparer la base de données de test (PostgreSQL)
      - name: Create Database and Schema
        run: |
          php bin/console doctrine:database:create --if-not-exists --env=test
          php bin/console doctrine:schema:create --env=test
          php bin/console doctrine:fixtures:load --no-interaction --env=test
        working-directory: backend
        env:
          DATABASE_URL: postgresql://anjtech:pass_test@127.0.0.1:5432/inventory_api_db_test
          # On remplace SQLite par une vraie base Postgres en CI

      # ETAPE 5 : Exécuter les tests PHPUnit
      - name: Exécuter les tests backend
        run: vendor/bin/phpunit
        working-directory: backend
        env:
          DATABASE_URL: postgresql://anjtech:pass_test@127.0.0.1:5432/inventory_api_db_test
          KERNEL_CLASS: App\Kernel
          # Lancement de la suite de tests avec l'environnement PostgreSQL

  backend-quality:
    name: backend-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql
          coverage: xdebug
      - name: Installation dépendances backend
        run: composer install --no-progress --prefer-dist
        working-directory: backend
      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --error-format=github
        working-directory: backend
      - name: Run tests with coverage
        run: vendor/bin/phpunit --coverage-text --coverage-clover=coverage.xml
        working-directory: backend
        env:
          DATABASE_URL: postgresql://anjtech:pass_test@127.0.0.1:5432/inventory_api_db_test
          KERNEL_CLASS: App\Kernel
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./backend/coverage.xml