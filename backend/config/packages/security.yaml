security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            id: App\Security\UserProvider

    role_hierarchy:
        ROLE_COMPTABLE_MATIERE: ROLE_USER
        ROLE_ADMIN: [ROLE_COMPTABLE_MATIERE, ROLE_ALLOWED_TO_SWITCH]

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        login:
            pattern: ^/api/login
            stateless: true
            json_login:
                check_path: /api/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api:
            pattern: ^/api
            stateless: true
            jwt: ~

    access_control:
        # Routes publiques
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/register, roles: PUBLIC_ACCESS }

        # Materiels
        - {
              path: ^/api/materiels,
              methods: [GET, PUT],
              roles: ROLE_COMPTABLE_MATIERE,
          }
        - { path: ^/api/materiels, roles: ROLE_ADMIN }

        # Categories
        - {
              path: ^/api/categories,
              methods: [GET, PUT],
              roles: ROLE_COMPTABLE_MATIERE,
          }
        - { path: ^/api/categories, roles: ROLE_ADMIN }

        # Users & validations : admin seulement
        - { path: ^/api/utilisateurs, roles: ROLE_ADMIN }
        - { path: ^/api/validations, roles: ROLE_ADMIN }

        # Demandes : tous les authentifiés
        - { path: ^/api/requests, roles: IS_AUTHENTICATED_FULLY }

        # Fallback
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
